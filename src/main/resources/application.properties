spring.application.name=BLOB
server.port=8095

# Permit bean overrides for offline development sandbox mock profiles
spring.main.allow-bean-definition-overriding=true

# ========================================================
# ? FILE STORAGE MAXIMUM STRUCTURAL BOUNDS
# ========================================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ========================================================
# ?? SERVICE REGISTRY MAPPING ENGINE (EUREKA)
# ========================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
# ========================================================
# ? CORE DATABASE STORAGE (POSTGRESQL) FOR MEDIA BLOB
# ========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ghost_social?createDatabaseIfNotExist=true
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false